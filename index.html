<style>
:root{
  --jouf:#7A4B98; --jouf-deep:#4A2A63; --jouf-soft:#F1EAF6; --jouf-line:#DCCFE6;
  --ink:#231B2B; --muted:#6E6478; --line:#E6E0EC; --paper:#FBFAFD; --surface:#FFFFFF;
  --ok:#2F7D5B; --ok-soft:#E3F2EA; --warn:#A8701A; --warn-soft:#FBF0DC; --late:#B4413B; --late-soft:#F8E4E2;
  --info:#2E5E8C; --info-soft:#E3EDF7;
  --radius:10px; --font:"Tajawal",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --jouf:#B48CD6; --jouf-deep:#E2D2F0; --jouf-soft:#2C2236; --jouf-line:#45365A;
    --ink:#EEE8F4; --muted:#A99DB6; --line:#3A3145; --paper:#16121B; --surface:#1F1926;
    --ok:#6CC59B; --ok-soft:#1D3229; --warn:#E3B062; --warn-soft:#382C17; --late:#EE8A84; --late-soft:#3B1F1E;
    --info:#86B4E3; --info-soft:#1C2A3A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --jouf:#B48CD6; --jouf-deep:#E2D2F0; --jouf-soft:#2C2236; --jouf-line:#45365A;
  --ink:#EEE8F4; --muted:#A99DB6; --line:#3A3145; --paper:#16121B; --surface:#1F1926;
  --ok:#6CC59B; --ok-soft:#1D3229; --warn:#E3B062; --warn-soft:#382C17; --late:#EE8A84; --late-soft:#3B1F1E;
  --info:#86B4E3; --info-soft:#1C2A3A; color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.65}
button,input,select,textarea,option,optgroup{font:inherit;font-family:var(--font);color:inherit}
h1,h2,h3,h4,h5,h6,table,th,td,small,label{font-family:var(--font)}
a{color:var(--jouf)}
:focus-visible{outline:2px solid var(--jouf);outline-offset:2px}
.demo-bar{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:13px;padding:6px 12px;border-bottom:1px solid var(--line)}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-side{background:var(--jouf-deep);color:#fff;padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .login-side{background:#2A1A3C}}
.login-side h1{font-size:34px;line-height:1.35;margin:0 0 12px;font-weight:800;max-width:14em}
.login-side p{opacity:.8;max-width:30em;margin:0}
.org-mini{display:flex;flex-direction:column;align-items:center;gap:10px;margin:40px 0}
.org-mini .n{border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 14px;font-size:13px;background:rgba(255,255,255,.06)}
.org-mini .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.org-mini .v{width:1px;height:14px;background:rgba(255,255,255,.35)}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-form form{width:100%;max-width:360px}
.login-form h2{margin:0 0 4px;font-size:24px}
.login-form .sub{color:var(--muted);margin:0 0 28px}
@media (max-width:820px){.login-wrap{grid-template-columns:1fr}.login-side{padding:32px 24px}.org-mini{display:none}}

/* ---------- form controls ---------- */
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:40px}
textarea.inp{min-height:76px;resize:vertical;line-height:1.7}
.inp:focus{border-color:var(--jouf);outline:none;box-shadow:0 0 0 3px var(--jouf-soft)}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:500;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--jouf-line);background:var(--jouf-soft)}
.btn.primary{background:var(--jouf);border-color:var(--jouf);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1a1222}}
.btn.primary:hover{filter:brightness(1.08);background:var(--jouf)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--late);border-color:var(--late-soft)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.block{width:100%;justify-content:center;padding:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{background:var(--late-soft);color:var(--late);padding:9px 12px;border-radius:8px;font-size:14px;margin-bottom:14px}
.hint{font-size:13px;color:var(--muted)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--surface);border-left:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand img.ju{height:54px;width:auto;flex:none}
.brand b{font-size:20px!important;color:var(--jouf);font-weight:800}
.brand b{display:block;font-size:14px;line-height:1.3}
.brand small{color:var(--muted);font-size:12px;line-height:1.5;display:block}
.brand{gap:12px!important}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);margin-bottom:2px;font-weight:500}
.nav a:hover{background:var(--jouf-soft)}
.nav a.on{background:var(--jouf-soft);color:var(--jouf);font-weight:700}
.nav .grp{font-size:12px;color:var(--muted);padding:14px 12px 4px}
.badge{background:var(--late);color:#fff;border-radius:20px;font-size:11px;padding:0 7px;line-height:19px;min-width:19px;text-align:center}
.badge.p{background:var(--jouf)}
.me{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;font-size:13px}
.me b{display:block;font-size:14px}
.main{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;font-weight:700}
.top .crumb{font-size:13px;color:var(--muted)}
.period{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.period select{border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--surface)}
.content{padding:24px 28px 60px;max-width:1280px}
.menu-btn{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;right:0;width:270px;z-index:30;transform:translateX(100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .top{padding:12px 16px}.content{padding:18px 16px 60px}
}

/* ---------- blocks ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
.panel h3{margin:0 0 12px;font-size:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h3{margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:18px;overflow:hidden}
.kpi{padding:14px 18px;border-left:1px solid var(--line)}
.kpi:last-child{border-left:0}
.kpi .v{font-size:28px;font-weight:800;line-height:1.2}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.alert .v{color:var(--late)}
.kpi.pend .v{color:var(--jouf)}
@media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(2){border-left:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:right;font-weight:600;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:var(--jouf-soft)}
.chip{display:inline-block;font-size:12px;border-radius:20px;padding:1px 10px;font-weight:600;white-space:nowrap}
.c-draft{background:var(--line);color:var(--muted)}
.c-submitted{background:var(--info-soft);color:var(--info)}
.c-returned{background:var(--warn-soft);color:var(--warn)}
.c-approved,.c-done{background:var(--ok-soft);color:var(--ok)}
.c-new{background:var(--jouf-soft);color:var(--jouf)}
.c-in_progress{background:var(--info-soft);color:var(--info)}
.c-cancelled{background:var(--line);color:var(--muted);text-decoration:line-through}
.c-late{background:var(--late-soft);color:var(--late)}
.muted{color:var(--muted)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.list-row:last-child{border-bottom:0}
.list-row .t1{font-weight:600}
.list-row .t2{font-size:13px;color:var(--muted)}

/* ---------- org chart (the signature) ---------- */
.org{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px 26px;margin-bottom:18px}
.org-top{display:flex;flex-direction:column;align-items:center}
.org-box{background:var(--jouf-deep);color:#fff;border-radius:8px;padding:8px 22px;font-weight:700;font-size:15px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .org-box{background:var(--jouf);color:#1a1222}}
.org-stem{width:2px;height:18px;background:var(--jouf-line)}
.org-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;position:relative;padding-top:18px}
.org-cols::before{content:"";position:absolute;top:0;right:calc((100% - 36px)/6);left:calc((100% - 36px)/6);height:2px;background:var(--jouf-line)}
.org-col{position:relative}
.org-col::before{content:"";position:absolute;top:-18px;right:50%;width:2px;height:18px;background:var(--jouf-line)}
.org-cols-wrap{margin:0 -1px}
.org-head{text-align:center;border:1.5px solid var(--jouf);color:var(--jouf);border-radius:8px;padding:7px 10px;font-weight:700;font-size:14px;margin-bottom:10px;background:var(--surface)}
.node{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-right:4px solid var(--line);border-radius:7px;padding:8px 11px;margin-bottom:7px;background:var(--surface)}
.node:hover{border-color:var(--jouf-line);background:var(--jouf-soft)}
.node.s-ok{border-right-color:var(--ok)}
.node.s-idle{border-right-color:var(--warn)}
.node.s-late{border-right-color:var(--late)}
.node.child{margin-right:18px;position:relative}
.node.child::before{content:"";position:absolute;right:-12px;top:-8px;width:8px;height:26px;border-right:1.5px solid var(--jouf-line);border-bottom:1.5px solid var(--jouf-line);border-bottom-right-radius:4px}
.node .nm{font-weight:600;font-size:14px;line-height:1.4}
.node .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.node .mt span{font-size:11.5px;color:var(--muted);background:var(--paper);border-radius:4px;padding:0 6px}
.node .mt span.r{color:var(--late);background:var(--late-soft)}
.node .mt span.p{color:var(--info);background:var(--info-soft)}
.legend{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:5px;vertical-align:-1px}
@media (max-width:900px){.org-cols{grid-template-columns:1fr;padding-top:0}.org-cols::before,.org-col::before{display:none}}

/* ---------- unit page ---------- */
.unit-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.unit-head h2{margin:0;font-size:22px}
.unit-head .meta{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:9px 16px;text-decoration:none;color:var(--muted);border-bottom:2.5px solid transparent;font-weight:500;white-space:nowrap}
.tabs a.on{color:var(--jouf);border-bottom-color:var(--jouf);font-weight:700}
.task{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.task:last-child{border-bottom:0}
.task .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--jouf-soft);color:var(--jouf);display:grid;place-items:center;font-size:12px;font-weight:700}
.task .tx{flex:1}
.cov{flex:none;font-size:12px;border-radius:20px;padding:1px 9px;white-space:nowrap}
.cov.y{background:var(--ok-soft);color:var(--ok)}
.cov.n{background:var(--paper);color:var(--muted);border:1px dashed var(--line)}
.bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--jouf);border-radius:5px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.stat .l{font-size:13px;color:var(--muted);min-height:2.6em;line-height:1.35}
.stat .v{font-size:24px;font-weight:800}
.stat input{width:100%;margin-top:6px}
.stat.auto{background:var(--jouf-soft);border-color:var(--jouf-line)}

/* ---------- minute editor ---------- */
.ed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
@media (max-width:800px){.ed-grid{grid-template-columns:1fr 1fr}}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}
.att-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.att-row .who{font-size:14px}
.att-row .who small{color:var(--muted);display:block;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:3px 9px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--jouf);color:#fff}
.item{border:1px solid var(--jouf-line);border-radius:var(--radius);padding:14px 16px 6px;margin-bottom:14px;background:var(--surface)}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.item-head b{color:var(--jouf)}
.dec-row{display:grid;grid-template-columns:1fr 200px 150px 34px;gap:8px;margin-bottom:8px;align-items:start}
@media (max-width:800px){.dec-row{grid-template-columns:1fr 1fr}.dec-row textarea{grid-column:1/-1}}
.x{border:1px solid var(--line);background:var(--surface);border-radius:7px;height:38px;cursor:pointer;color:var(--late)}
.sticky-actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 0;display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;margin-top:10px;z-index:4;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}

/* ---------- formal minute document ---------- */
.doc{background:#fff;color:#1d1724;border:1px solid var(--line);border-radius:4px;max-width:820px;margin:0 auto;padding:40px 48px;font-size:14.5px;line-height:1.9}
.doc-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:2px solid #6A3D8F;padding-bottom:12px;margin-bottom:18px;font-size:13px}
.doc-head .r{line-height:1.7;font-weight:600}
.doc-head .c{text-align:center}
.doc-head .c .seal{width:62px;height:62px;border-radius:50%;border:2px solid #6A3D8F;color:#6A3D8F;display:grid;place-items:center;font-weight:800;font-size:12px;line-height:1.2;margin:0 auto}
.doc-head .l{text-align:left;line-height:1.7}
.doc h2{text-align:center;font-size:18px;margin:6px 0 16px;color:#3B2156}
.doc h4{font-size:15px;margin:18px 0 6px;color:#3B2156;border-bottom:1px solid #DCCFE6;padding-bottom:3px}
.doc table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
.doc th,.doc td{border:1px solid #CFC4DA;padding:5px 8px;text-align:right;vertical-align:top}
.doc th{background:#F1EAF6;font-weight:700}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:36px;text-align:center}
.doc .sig div{border-top:1px dashed #9a8fa6;padding-top:6px}
.doc .stamp{display:inline-block;border:2px solid #2F7D5B;color:#2F7D5B;border-radius:6px;padding:2px 12px;font-weight:700;font-size:13px;transform:rotate(-3deg)}
.doc .wm{color:#A8701A;border-color:#A8701A}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 auto 16px;max-width:820px}
.note-box{max-width:820px;margin:0 auto 16px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px}

/* ---------- modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(20,12,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 16px}
.modal .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.checks label{font-size:13.5px;display:flex;gap:6px;align-items:flex-start}
.pw-show{font-family:var(--font);font-weight:700;background:var(--jouf-soft);color:var(--jouf);padding:10px 14px;border-radius:8px;font-size:18px;text-align:center;letter-spacing:1px;direction:ltr;user-select:all}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:8px;z-index:60;font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--surface);min-height:36px}

/* ---------- splash ---------- */
.only-dark{display:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .only-dark{display:inline-block!important}:root:not([data-theme="light"]) .only-light{display:none!important}}
:root[data-theme="dark"] .only-dark{display:inline-block!important}:root[data-theme="dark"] .only-light{display:none!important}
#splash{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:30px;padding:24px;animation:spIn .9s cubic-bezier(.2,.7,.2,1) both}
#splash img{width:min(560px,82vw);height:auto}
.sp-bar{width:min(220px,50vw);height:4px;border-radius:4px;background:var(--jouf-soft);overflow:hidden}
.sp-bar i{display:block;height:100%;width:100%;background:var(--jouf);border-radius:4px;transform-origin:right;animation:spBar 3s linear both}
@keyframes spIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){#splash .sp-in,.sp-bar i{animation:none}}

@media print{
  body{background:#fff}
  .side,.top,.doc-actions,.demo-bar,.note-box,.toast,.no-print{display:none!important}
  .shell{display:block}.content{padding:0;max-width:none}
  .doc{border:0;padding:0;max-width:none}
  @page{size:A4;margin:16mm 14mm}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

    const ua=this.t("unit_access"); units.forEach(u=>ua.push({user_id:id,unit_id:u})); this.w("unit_access",ua);
  },
  async resetPassword(id,pw){ const a=this.t("auth"); const r=a.find(x=>x.id===id); r.salt=uuid(); r.hash=await sha(r.salt+pw); this.w("auth",a); const p=this.t("profiles"); p.find(x=>x.id===id).must_change_password=true; this.w("profiles",p); },
  async updateUser({id,full_name,role,is_active,units}){
    const p=this.t("profiles"); Object.assign(p.find(x=>x.id===id),{full_name,role,is_active}); this.w("profiles",p);
    this.w("unit_access",this.t("unit_access").filter(x=>x.user_id!==id).concat(units.map(u=>({user_id:id,unit_id:u}))));
  }
};

/* ---------------- storage (Supabase) ---------------- */
const SupaStore = {
  mode:"live", sb:null,
  async init(){
    await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"; s.onload=res; s.onerror=()=>rej(new Error("تعذّر تحميل مكتبة الاتصال")); document.head.appendChild(s); });
    this.sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:true, storageKey:"apc-auth"}});
  },
  ck({data,error}){ if(error) throw new Error(error.message); return data; },
  async profile(uid){ const p=this.ck(await this.sb.from("profiles").select("*").eq("id",uid).single()); if(!p.is_active){ await this.sb.auth.signOut(); throw new Error("الحساب موقوف"); } return p; },
  async restore(){ const {data}=await this.sb.auth.getSession(); if(!data.session) return null; try{ return await this.profile(data.session.user.id); }catch(e){ return null; } },
  async signIn(username,password){
    const {data,error}=await this.sb.auth.signInWithPassword({email:username.trim().toLowerCase()+EMAIL_DOMAIN,password});
    if(error) throw new Error(/banned/i.test(error.message)?"الحساب موقوف، تواصل مع مشرف الشؤون الأكاديمية":"اسم المستخدم أو كلمة المرور غير صحيحة");
    return this.profile(data.user.id);
  },
  async signOut(){ await this.sb.auth.signOut(); },
  async changePassword(pw){ const {error}=await this.sb.auth.updateUser({password:pw}); if(error) throw new Error(error.message); this.ck(await this.sb.rpc("mark_password_changed")); },
  async select(name){ return this.ck(await this.sb.from(name).select("*")); },
  async upsert(name,rows,keys=["id"]){ if(!rows.length) return; this.ck(await this.sb.from(name).upsert(rows,{onConflict:keys.join(",")})); },
  async update(name,id,patch){ this.ck(await this.sb.from(name).update(patch).eq("id",id)); },
  async remove(name,id){ this.ck(await this.sb.from(name).delete().eq("id",id)); },
  async removeWhere(name,field,value,exceptIds=[]){ let q=this.sb.from(name).delete().eq(field,value); if(exceptIds.length) q=q.not("id","in","("+exceptIds.join(",")+")"); this.ck(await q); },
  async createUser({username,full_name,role,password,units}){ this.ck(await this.sb.rpc("admin_create_user",{p_username:username,p_full_name:full_name,p_role:role,p_password:password,p_units:units})); },
  async resetPassword(id,pw){ this.ck(await this.sb.rpc("admin_reset_password",{p_user:id,p_password:pw})); },
  async updateUser({id,full_name,role,is_active,units}){ this.ck(await this.sb.rpc("admin_update_user",{p_user:id,p_full_name:full_name,p_role:role,p_active:is_active,p_units:units})); }
};

const Store = (SUPABASE_URL && SUPABASE_ANON_KEY) ? SupaStore : LocalStore;

/* ---------------- state ---------------- */
const S = { user:null, units:[], minutes:[], decisions:[], stats:[], settings:{}, profiles:[], access:[], view:{year:null,semester:null}, draft:null };

async function loadAll(){
  const [units,minutes,decisions,stats,settings,profiles,access] = await Promise.all(
    ["units","minutes","decisions","stats","settings","profiles","unit_access"].map(t=>Store.select(t)));
  S.units = units.sort((a,b)=>a.sort-b.sort);
  S.minutes=minutes; S.decisions=decisions; S.stats=stats; S.profiles=profiles; S.access=access;
  S.settings = Object.fromEntries(settings.map(s=>[s.key,s.value]));
  if(!S.view.year){ S.view.year=S.settings.year||"1448"; S.view.semester=S.settings.semester||SEMESTERS[0]; }
}
const isAdmin = () => S.user?.role==="admin";
const myUnits = () => S.access.filter(a=>a.user_id===S.user.id).map(a=>a.unit_id);
const visibleUnits = () => (S.user.role==="supervisor") ? S.units.filter(u=>myUnits().includes(u.id)) : S.units;
const canWrite = uid => isAdmin() || myUnits().includes(uid);
const unitById = id => S.units.find(u=>u.id===id);
const supervisorOf = u => (u.members.find(m=>m.role.includes("مشرف"))||{}).name || "—";
const unitMinutes = (uid, sem) => S.minutes.filter(m=>m.unit_id===uid && m.year===S.view.year && (!sem || m.semester===sem));
const unitDecisions = uid => S.decisions.filter(d=>d.unit_id===uid);

function unitSummary(u){
  const ms = unitMinutes(u.id, S.view.semester);
  const msY = unitMinutes(u.id);
  const ids = new Set(msY.map(m=>m.id));
  const ds = S.decisions.filter(d=>ids.has(d.minute_id));
  const late = ds.filter(isLate).length;
  const done = ds.filter(d=>d.status==="done").length;
  const active = ds.filter(d=>d.status!=="cancelled").length;
  const covered = new Set(); msY.forEach(m=>(m.items||[]).forEach(it=>{ if(it.task!==null && it.task!=="" && it.task>=0) covered.add(+it.task); }));
  const last = msY.map(m=>m.meeting_date).sort().pop();
  return { minutes:ms.length, approved:ms.filter(m=>m.status==="approved").length, pending:ms.filter(m=>m.status==="submitted").length,
           decisions:active, done, late, completion:pct(done,active), coverage:pct(covered.size,u.tasks.length), covered, last,
           state: late? "late" : (ms.length? "ok":"idle") };
}

/* ---------------- router ---------------- */
function go(h){ if(location.hash===h) render(); else location.hash=h; }
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });

function hideSplash(){ const sp=$("#splash"); if(!sp) return; sp.classList.add("out"); setTimeout(()=>sp.remove(),700); }
async function boot(){
  const minShow=new Promise(r=>setTimeout(r,SPLASH_MS));
  try{
    await Store.init();
    S.user = await Store.restore();
    if(S.user) await loadAll();
  }catch(e){ $("#app").innerHTML=`<div class="content"><div class="err">${esc(e.message)}</div></div>`; await minShow; hideSplash(); return; }
  try{ await document.fonts?.ready; }catch(e){}
  render();
  await minShow; hideSplash();
}

function render(){
  if(!S.user) return renderLogin();
  if(S.user.must_change_password) return renderForcePw();
  const [ , r, a, b] = (location.hash||"#/home").split("?")[0].split("/");
  let html="", title="", crumb="";
  try{
    switch(r){
      case "unit": ({html,title,crumb}=viewUnit(a,b||"overview")); break;
      case "minute": ({html,title,crumb}= a==="new" ? viewEditor(null,b) : (b==="edit"? viewEditor(a) : viewMinute(a))); break;
      case "minutes": ({html,title}=viewMinutesAll()); break;
      case "decisions": ({html,title}=viewDecisions()); break;
      case "stats": ({html,title}=viewStats()); break;
      case "users": ({html,title}= isAdmin()? viewUsers() : viewHome()); break;
      case "settings": ({html,title}= isAdmin()? viewSettings() : viewHome()); break;
      case "units": ({html,title}=viewUnitsList()); break;
      default: ({html,title}=viewHome());
    }
  }catch(e){ console.error(e); html=`<div class="err">تعذّر عرض الصفحة: ${esc(e.message)}</div>`; }
  $("#app").innerHTML = shell(html,title,crumb,r||"home");
  afterRender();
}

function bindEditor(){
  const f=$("#edf"); if(!f) return; const d=S.draft;
  const attCount=()=>{ const c={present:0,absent:0,excused:0}; d.attendance.forEach(a=>c[a.state]++); $("#attc").textContent=`حاضر ${c.present} · غائب ${c.absent} · معتذر ${c.excused}`; };
  attCount();
  f.addEventListener("input",e=>{
    const t=e.target;
    if(t.dataset.k){ d[t.dataset.k]= t.type==="number"? +t.value : t.value; if(t.dataset.k==="meeting_date") $("#hij").value=weekday(t.value)+" "+fmtH(t.value); }
    else if(t.dataset.dk){ d.items[t.dataset.i].decisions[t.dataset.j][t.dataset.dk]=t.value; }
    else if(t.dataset.ik){ d.items[t.dataset.i][t.dataset.ik]= t.dataset.ik==="task"? (t.value===""?"":+t.value) : t.value; }
  });
  f.addEventListener("click",async e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.closest(".seg")){ const i=b.closest(".seg").dataset.att; d.attendance[i].state=b.dataset.v; b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); attCount(); return; }
    if(b.dataset.addDec!==undefined){ d.items[b.dataset.addDec].decisions.push({id:uuid(),text:"",owner:"",due_date:"",status:"new"}); render(); return; }
    if(b.dataset.delDec){ const [i,j]=b.dataset.delDec.split(":"); d.items[i].decisions.splice(j,1); render(); return; }
    if(b.dataset.delItem!==undefined){ if(confirm("حذف هذا البند وقراراته؟")){ d.items.splice(b.dataset.delItem,1); render(); } return; }
    if(b.dataset.act==="additem"){ d.items.push({id:uuid(),topic:"",task:"",discussion:"",decisions:[]}); render(); return; }
    if(b.dataset.act==="addprev"){
      const prev=S.minutes.filter(x=>x.unit_id===d.unit_id&&x.id!==d.id&&x.meeting_date<=d.meeting_date).sort((a,b2)=>(b2.year+String(b2.seq).padStart(3,"0")).localeCompare(a.year+String(a.seq).padStart(3,"0")))[0];
      if(!prev) return toast("لا يوجد محضر سابق قبل هذا التاريخ");
      const ds=S.decisions.filter(x=>x.minute_id===prev.id);
      d.items.unshift({id:uuid(),topic:`متابعة تنفيذ قرارات الاجتماع السابق رقم (${prev.seq})`,task:"",discussion: ds.length? ds.map((x,k)=>`${k+1}. ${x.text}: ${D_STATUS[x.status]}${x.progress_note?" ("+x.progress_note+")":""}`).join("\n") : "لا توجد قرارات مسجلة في الاجتماع السابق.",decisions:[]});
      render(); return;
    }
    if(b.dataset.save) await saveMinute(b.dataset.save,b);
  });
}
async function saveMinute(status,btn){
  const d=S.draft; const u=unitById(d.unit_id);
  if(!d.meeting_date) return toast("حدّد تاريخ الاجتماع");
  if(d.items.some(it=>!it.topic.trim())) return toast("اكتب موضوع كل بند أو احذف البند الفارغ");
  if(S.minutes.some(m=>m.unit_id===d.unit_id&&m.year===d.year&&m.seq===d.seq&&m.id!==d.id)) return toast(`يوجد محضر برقم ${d.seq} لهذه الوحدة في ${d.year}هـ`);
  if(status!=="draft" && !d.attendance.some(a=>a.state==="present")) return toast("سجّل الحضور قبل الرفع");
  btn.disabled=true;
  try{
    const id=d.id||uuid();
    const row={id,unit_id:d.unit_id,year:d.year,semester:d.semester,seq:d.seq,ref:`${u.id}-${d.year}-${String(d.seq).padStart(2,"0")}`,meeting_date:d.meeting_date,start_time:d.start_time,end_time:d.end_time,
      place:d.place,mode:d.mode,attendance:d.attendance,guests:d.guests,items:d.items.map(({decisions,...it})=>it),status,review_note: status==="draft"? (d.review_note||null) : null};
    if(!d.id){ row.created_by=S.user.id; }
    if(Store.mode==="demo" && status==="approved"){ row.approved_by=S.user.id; row.approved_at=new Date().toISOString(); }
    await Store.upsert("minutes",[row]);
    const decs=[]; d.items.forEach((it,i)=>(it.decisions||[]).forEach(x=>{ if(x.text&&x.text.trim()) decs.push({id:x.id||uuid(),minute_id:id,unit_id:d.unit_id,item_idx:i,text:x.text.trim(),owner:x.owner||null,due_date:x.due_date||null,status:x.status||"new",progress_note:x.progress_note||null}); }));
    await Store.removeWhere("decisions","minute_id",id,decs.map(x=>x.id));
    await Store.upsert("decisions",decs);
    await loadAll(); S.draft=null;
    toast(status==="draft"?"حُفظت المسودة":status==="approved"?"حُفظ المحضر واعتُمد":"رُفع المحضر للاعتماد");
    go("#/minute/"+id);
  }catch(e){ toast("تعذّر الحفظ: "+e.message); btn.disabled=false; }
}

  const others=m.attendance.filter(a=>a.state!=="present");

function viewMinute(id){

  const u=unitById(m.unit_id); const w=canWrite(m.unit_id);
  const canEdit = w && (["draft","returned"].includes(m.status) || isAdmin());
  return {title:`المحضر رقم ${m.seq}`, crumb:`<a href="#/unit/${u.id}/minutes">${esc(u.name)}</a>`, html:`
    ${m.status==="returned"&&m.review_note?`<div class="note-box"><b>معاد للتعديل:</b> ${esc(m.review_note)}</div>`:""}

      ${w && ["draft","returned"].includes(m.status) && !isAdmin()?`<button class="btn primary" data-mstatus="submitted">رفع للاعتماد</button>`:""}
      ${isAdmin() && m.status!=="approved"?`<button class="btn ok" data-mstatus="approved">اعتماد المحضر</button><button class="btn" data-act="return">إعادة للتعديل</button>`:""}
      ${isAdmin() && m.status==="approved"?`<button class="btn" data-mstatus="draft">إلغاء الاعتماد</button>`:""}
      ${(isAdmin() || (w && ["draft","returned"].includes(m.status)))?`<button class="btn danger" data-act="delminute">حذف</button>`:""}

}
async function setMinuteStatus(id,status,note){
  const patch={status,review_note:note??null};
  if(Store.mode==="demo"&&status==="approved"){ patch.approved_by=S.user.id; patch.approved_at=new Date().toISOString(); }
  if(status==="draft"){ patch.approved_by=null; patch.approved_at=null; }
  try{ await Store.update("minutes",id,patch); await loadAll(); toast({submitted:"رُفع المحضر للاعتماد",approved:"اعتُمد المحضر",returned:"أُعيد المحضر للتعديل",draft:"أُلغي الاعتماد"}[status]); render(); }
  catch(e){ toast("تعذّر التنفيذ: "+e.message); }
}

/* ---------------- decisions ---------------- */
function decisionsTable(ds){
  ds=[...ds].sort((a,b)=>(isLate(b)-isLate(a)) || String(a.due_date||"9").localeCompare(String(b.due_date||"9")));
  if(!ds.length) return `<div class="panel"><div class="empty">لا توجد قرارات مطابقة.</div></div>`;
  return `<div class="panel tbl-wrap"><table class="t"><thead><tr><th>القرار</th><th>الوحدة / المحضر</th><th>المسؤول</th><th>الموعد</th><th>الحالة</th><th>ملاحظة المتابعة</th></tr></thead><tbody>
    ${ds.map(d=>{ const m=S.minutes.find(x=>x.id===d.minute_id); const u=unitById(d.unit_id); const w=canWrite(d.unit_id); return `<tr>
      <td style="min-width:240px">${esc(d.text)}</td><td><a href="#/minute/${d.minute_id}">${esc(u?.name)}<br><span class="hint">محضر ${m?m.seq:"—"}</span></a></td>
      <td>${esc(d.owner||"—")}</td><td>${d.due_date?`<span class="chip ${isLate(d)?"c-late":""}" style="${isLate(d)?"":"padding:0"}">${fmtG(d.due_date)}</span>`:"—"}</td>
      <td>${w?`<select class="inp" style="min-height:32px;padding:3px 8px" data-dec-status="${d.id}">${Object.entries(D_STATUS).map(([k,v])=>`<option value="${k}" ${d.status===k?"selected":""}>${v}</option>`).join("")}</select>`:`<span class="chip c-${d.status}">${D_STATUS[d.status]}</span>`}</td>
      <td style="min-width:180px">${w?`<input class="inp" style="min-height:32px;padding:3px 8px" data-dec-note="${d.id}" value="${esc(d.progress_note||"")}" placeholder="ما الذي تم؟">`:esc(d.progress_note||"—")}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}
function viewDecisions(){
  const units=visibleUnits(); const q=new URLSearchParams((location.hash.split("?")[1])||"");
  const un=q.get("unit")||"", st=q.get("status")||"", late=q.get("late")==="1";
  let ds=S.decisions.filter(d=>units.some(u=>u.id===d.unit_id) && S.minutes.some(m=>m.id===d.minute_id&&m.year===S.view.year));
  if(un) ds=ds.filter(d=>d.unit_id===un); if(st) ds=ds.filter(d=>d.status===st); if(late) ds=ds.filter(isLate);
  const all=ds.length, done=ds.filter(d=>d.status==="done").length;
  return {title:"متابعة القرارات", html:`<div class="panel"><div class="panel-head"><div class="filters">
      <select data-filter="unit"><option value="">كل الوحدات واللجان</option>${units.map(u=>`<option value="${u.id}" ${un===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select>
      <select data-filter="status"><option value="">كل الحالات</option>${Object.entries(D_STATUS).map(([k,v])=>`<option value="${k}" ${st===k?"selected":""}>${v}</option>`).join("")}</select>
      <label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-filter="late" ${late?"checked":""}> المتأخرة فقط</label></div>
      <div style="display:flex;gap:10px;align-items:center"><span class="hint">${all} قرار، نُفّذ ${done} (${pct(done,all)}%)</span><button class="btn sm" data-act="csvdec">تصدير CSV</button></div></div></div>
    ${decisionsTable(ds)}`};
}

  const covAvg=Math.round(sums.reduce((a,[,s])=>a+s.coverage,0)/(sums.length||1));

    <div class="kpis"><div class="kpi"><div class="v">${tot.m}</div><div class="l">محاضر ${esc(S.view.semester)}</div></div>

      <table class="t"><thead><tr><th>الوحدة / اللجنة</th><th>محاضر الفصل</th><th>معتمد</th><th>قرارات العام</th><th>نسبة التنفيذ</th><th>متأخر</th><th>تغطية المهام</th><th>آخر اجتماع</th></tr></thead><tbody>
      ${sums.map(([u,s])=>`<tr class="clk" data-href="#/unit/${u.id}/stats"><td><b>${esc(u.name)}</b></td><td>${s.minutes}</td><td>${s.approved}</td><td>${s.decisions}</td>
        <td><div style="display:flex;gap:8px;align-items:center"><div class="bar"><i style="width:${s.completion}%"></i></div><span class="hint">${s.completion}%</span></div></td>
        <td>${s.late?`<span class="chip c-late">${s.late}</span>`:"—"}</td><td>${s.coverage}%</td><td>${s.last?fmtG(s.last):"—"}</td></tr>`).join("")}</tbody></table></div>
    <div class="panel"><h3>المؤشرات النوعية لكل وحدة ولجنة · ${esc(S.view.semester)} ${S.view.year}هـ</h3>
      <div class="stat-grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${units.map(u=>`<div class="stat"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px"><b>${esc(u.name)}</b><a class="hint" href="#/unit/${u.id}/stats">تحديث</a></div>
        <table class="t" style="font-size:13px"><tbody>${u.stats.map(d=>{ const v=statVal(u.id,d.key); return `<tr><td style="padding:4px 0">${esc(d.label)}</td><td style="padding:4px 0;text-align:left;font-weight:700">${v??'<span class="muted">—</span>'}${v!=null&&d.unit==="%"?"%":""}</td></tr>`; }).join("")}</tbody></table></div>`).join("")}</div></div>`};

function userModal(p, presetUnit){

  const name=p? p.full_name : (presetUnit? supervisorOf(unitById(presetUnit)) : "");
  // also preselect other units the same person supervises

  modal(`<h3>${p?"تعديل مستخدم":"إضافة مستخدم"}</h3><form id="uf"><div id="uerr"></div>

    <label class="f"><span>الدور</span><select class="inp" name="role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${(p?.role||"supervisor")===k?"selected":""}>${v}</option>`).join("")}</select></label>

    ${p?`<label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="active" ${p.is_active?"checked":""}> الحساب نشط</label>`:""}
    <div class="acts"><button class="btn primary">${p?"حفظ التعديلات":"إنشاء الحساب"}</button><button type="button" class="btn" data-close>إلغاء</button></div></form>`);

}

/* ---------------- modal ---------------- */
function modal(html){ closeModal(); const o=document.createElement("div"); o.className="ov"; o.id="ov"; o.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener("click",e=>{ if(e.target===o||e.target.closest("[data-close]")) closeModal(); }); document.body.appendChild(o); o.querySelector("input,select,textarea,button")?.focus(); }
function closeModal(){ $("#ov")?.remove(); }
function chpwModal(){
  modal(`<h3>تغيير كلمة المرور</h3><form id="cf"><div id="cerr"></div>
    <label class="f"><span>كلمة المرور الجديدة (8 أحرف على الأقل، حروف وأرقام)</span><input class="inp" type="password" name="a" dir="ltr" autocomplete="new-password" required></label>
    <label class="f"><span>تأكيد كلمة المرور</span><input class="inp" type="password" name="b" dir="ltr" autocomplete="new-password" required></label>
    <div class="acts"><button class="btn primary">حفظ</button><button type="button" class="btn" data-close>إلغاء</button></div></form>`);
  $("#cf").onsubmit=async e=>{ e.preventDefault(); const f=e.target;
    if(!pwRules(f.a.value)) return $("#cerr").innerHTML=`<div class="err">كلمة المرور يجب ألا تقل عن 8 أحرف وتجمع بين حروف وأرقام.</div>`;
    if(f.a.value!==f.b.value) return $("#cerr").innerHTML=`<div class="err">كلمتا المرور غير متطابقتين.</div>`;
    try{ await Store.changePassword(f.a.value); closeModal(); toast("تم تغيير كلمة المرور"); }catch(err){ $("#cerr").innerHTML=`<div class="err">${esc(err.message)}</div>`; } };
}

/* ---------------- events ---------------- */
function setQuery(k,v){ const [base,qs]=location.hash.split("?"); const q=new URLSearchParams(qs||""); v?q.set(k,v):q.delete(k); const s=q.toString(); go(base+(s?"?"+s:"")); }
function afterRender(){
  const app=$("#app");
  app.onclick = async e => {
    const tr=e.target.closest("tr[data-href]"); if(tr && !e.target.closest("a,button,select,input")) return go(tr.dataset.href);
    const b=e.target.closest("[data-act],[data-mstatus],[data-edit-user],[data-reset-user],[data-newuser-for],[data-edit-unit]"); if(!b) return;
    const a=b.dataset.act;
    if(a==="logout") return logout();
    if(a==="chpw") return chpwModal();
    if(a==="menu") return $("#side").classList.toggle("open");
    if(a==="print") return window.print();
    if(a==="canceled"){ S.draft=null; return; }
    if(a==="newuser") return userModal(null);
    if(b.dataset.newuserFor) return userModal(null,b.dataset.newuserFor);
    if(b.dataset.editUser) return userModal(S.profiles.find(p=>p.id===b.dataset.editUser));
    if(b.dataset.editUnit) return unitModal(unitById(b.dataset.editUnit));
    if(b.dataset.resetUser){ const p=S.profiles.find(x=>x.id===b.dataset.resetUser); if(!confirm(`إعادة تعيين كلمة مرور ${p.full_name}؟ سيُطلب منه تعيين كلمة جديدة عند الدخول.`)) return;
      const pw=genPassword(); try{ await Store.resetPassword(p.id,pw); await loadAll(); render(); showPw(p.username,pw); }catch(err){ toast(err.message); } return; }
    if(a==="newminute"){ const us=visibleUnits().filter(u=>canWrite(u.id)); if(us.length===1) return go("#/minute/new/"+us[0].id);
      return modal(`<h3>محضر جديد لـ</h3>${us.map(u=>`<a class="node" href="#/minute/new/${u.id}" data-close>${esc(u.name)}</a>`).join("")}<div class="acts"><button class="btn" data-close>إلغاء</button></div>`); }
    if(b.dataset.mstatus){ const id=location.hash.split("/")[2]; const st=b.dataset.mstatus;
      if(st==="approved" && !confirm("اعتماد هذا المحضر؟ لن يتمكن مشرف الوحدة من تعديله بعد الاعتماد.")) return;
      return setMinuteStatus(id,st); }
    if(a==="return"){ const id=location.hash.split("/")[2];
      modal(`<h3>إعادة المحضر للتعديل</h3><form id="rf"><label class="f"><span>ملاحظاتك لمشرف الوحدة</span><textarea class="inp" name="n" required></textarea></label><div class="acts"><button class="btn primary">إعادة</button><button type="button" class="btn" data-close>إلغاء</button></div></form>`);
      $("#rf").onsubmit=e2=>{ e2.preventDefault(); const n=e2.target.n.value; closeModal(); setMinuteStatus(id,"returned",n); }; return; }
    if(a==="delminute"){ const id=location.hash.split("/")[2]; if(!confirm("حذف المحضر وقراراته نهائيًا؟")) return;
      try{ await Store.removeWhere("decisions","minute_id",id); await Store.remove("minutes",id); await loadAll(); toast("حُذف المحضر"); go("#/minutes"); }catch(err){ toast(err.message); } return; }
    if(a==="csvdec"){ const units=visibleUnits(); const ds=S.decisions.filter(d=>units.some(u=>u.id===d.unit_id));
      return csvDownload(`قرارات_${S.view.year}.csv`,[["الوحدة","رقم المحضر","تاريخ المحضر","القرار","المسؤول","موعد التنفيذ","الحالة","ملاحظة المتابعة","متأخر"],...ds.map(d=>{const m=S.minutes.find(x=>x.id===d.minute_id)||{}; return [unitById(d.unit_id)?.name,m.seq,m.meeting_date,d.text,d.owner,d.due_date,D_STATUS[d.status],d.progress_note,isLate(d)?"نعم":""];})]); }
    if(a==="csvstats"){ const rows=[["الوحدة","المؤشر","القيمة","الفصل","العام"]]; visibleUnits().forEach(u=>{ const s=unitSummary(u);
        rows.push([u.name,"محاضر الفصل",s.minutes,S.view.semester,S.view.year],[u.name,"نسبة تنفيذ القرارات %",s.completion,S.view.semester,S.view.year],[u.name,"قرارات متأخرة",s.late,S.view.semester,S.view.year],[u.name,"تغطية المهام %",s.coverage,S.view.semester,S.view.year]);
        u.stats.forEach(d=>rows.push([u.name,d.label+(d.unit==="%"?" %":""),statVal(u.id,d.key)??"",S.view.semester,S.view.year])); });
      return csvDownload(`مؤشرات_${S.view.semester}_${S.view.year}.csv`,rows); }
  };
  app.onchange = async e => {
    const t=e.target;
    if(t.dataset.period){ S.view[t.dataset.period]=t.value; return render(); }
    if(t.dataset.filter){ return setQuery(t.dataset.filter, t.type==="checkbox"? (t.checked?"1":"") : t.value); }
    if(t.dataset.decStatus){ try{ await Store.update("decisions",t.dataset.decStatus,{status:t.value,updated_at:new Date().toISOString()}); await loadAll(); toast("حُدّثت حالة القرار"); render(); }catch(err){ toast(err.message); } }
    if(t.dataset.decNote){ try{ await Store.update("decisions",t.dataset.decNote,{progress_note:t.value,updated_at:new Date().toISOString()}); const d=S.decisions.find(x=>x.id===t.dataset.decNote); if(d) d.progress_note=t.value; toast("حُفظت الملاحظة"); }catch(err){ toast(err.message); } }
  };
  const sf=$("#statf"); if(sf) sf.onsubmit=async e=>{ e.preventDefault(); const uid=sf.dataset.unit; const u=unitById(uid);
    const rows=u.stats.map(d=>({unit_id:uid,year:S.view.year,semester:S.view.semester,key:d.key,value:sf.elements[d.key].value===""?null:+sf.elements[d.key].value,updated_by:S.user.id,updated_at:new Date().toISOString()}));
    try{ await Store.upsert("stats",rows,["unit_id","year","semester","key"]); await loadAll(); toast("حُفظت المؤشرات"); render(); }catch(err){ toast(err.message); } };
  const st=$("#setf"); if(st) st.onsubmit=async e=>{ e.preventDefault(); try{ await Store.upsert("settings",[{key:"year",value:st.year.value.trim()},{key:"semester",value:st.semester.value}],["key"]); await loadAll(); S.view.year=S.settings.year; S.view.semester=S.settings.semester; toast("حُفظت الإعدادات"); render(); }catch(err){ toast(err.message); } };
  bindEditor();
}

boot();
</script>
</body>
</html>
